worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;  # Don't advertise nginx version in headers or error pages

    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml application/wasm;

    # Rate-limiting zones — used in location blocks below
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # TLS — Mozilla Intermediate profile (TLS 1.2 + 1.3, broad device support).
        # ECDHE-only ciphers; no DHE so dhparam is not required.
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;   # let client pick among our allowed ciphers
        ssl_ecdh_curve            X25519:secp384r1;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;   # disable — session tickets weaken PFS

        # OCSP stapling — requires CA-signed cert (e.g. Let's Encrypt fullchain).
        # Safe to leave on with self-signed certs; nginx will just log a warning.
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        client_max_body_size 25M;
        limit_conn perip 30;

        # ── Security headers ─────────────────────────────────────────────────
        # Defined at server level so all locations inherit them automatically.
        #
        # NGINX CAVEAT: any location that contains its own add_header directives
        # will lose these inherited values — see /uploads/ for the workaround.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options            "DENY"                               always;
        add_header X-Content-Type-Options     "nosniff"                            always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"    always;
        add_header Permissions-Policy         "camera=(), microphone=(self), geolocation=()" always;
        # CSP: wasm-unsafe-eval for WebCrypto/WASM; wss: for Socket.IO; unsafe-inline
        # for style required by React inline styles and Vite's injected <style> tags.
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss:; font-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Auth endpoints — tighter rate limit ──────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }

        # ── General API ──────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }

        # ── WebSocket ────────────────────────────────────────────────────────
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }

        # ── Encrypted uploads ────────────────────────────────────────────────
        # This location defines its own add_header so ALL security headers must
        # be repeated explicitly (nginx inheritance rule).
        # CSP is set to default-src 'none' — uploaded blobs need zero execution.
        location /uploads/ {
            alias /var/uploads/;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options            "DENY"                               always;
            add_header X-Content-Type-Options     "nosniff"                            always;
            add_header Referrer-Policy            "no-referrer"                        always;
            add_header Content-Security-Policy    "default-src 'none'"                 always;
            add_header Cache-Control              "public, max-age=604800"             always;
        }

        # ── Frontend SPA ─────────────────────────────────────────────────────
        # Strip any security headers the internal frontend container adds so the
        # browser only ever sees one authoritative set (the server-level headers
        # defined above — no add_header here, so inheritance works correctly).
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;

            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Strict-Transport-Security;
        }
    }
}
