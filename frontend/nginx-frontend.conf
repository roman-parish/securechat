server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers here are defense-in-depth for direct container access.
    # The main nginx reverse proxy strips these via proxy_hide_header and
    # replaces them with the authoritative set — so no duplicates reach browsers.
    #
    # NOTE: CSP is intentionally omitted here to avoid conflicting with the
    # main nginx CSP (browser enforces the intersection = most restrictive).
    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed JS/CSS — immutable, 1-year cache.
    # Repeats add_header because nginx drops parent headers when a location
    # defines its own.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control      "public, immutable" always;
        add_header X-Content-Type-Options "nosniff"       always;
    }

    # Images and PWA assets — 7-day cache, revalidate
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|webmanifest)$ {
        expires 7d;
        add_header Cache-Control          "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                 always;
    }

    # Service worker — never cache (stale SW breaks PWA updates)
    location = /sw.js {
        add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                             always;
    }

    # PWA manifest — short TTL so icon/name changes propagate quickly
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control          "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                 always;
    }
}
